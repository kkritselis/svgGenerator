<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form id="svgForm">
        <label for="width">Width:</label>
        <input type="number" id="width" name="width" required>
        
        <label for="height">Height:</label>
        <input type="number" id="height" name="height" required>
        
        <!-- Add checkboxes here -->
        <div>
            <input type="checkbox" id="wineGlass" name="options" value="Wine Glass">
            <label for="wineGlass">Wine Glass</label>
        </div>
        <!-- ... (Repeat for each item) ... -->
        <div>
            <input type="checkbox" id="bathroom" name="options" value="Bathroom">
            <label for="bathroom">Bathroom</label>
        </div>

        <input type="submit" value="Generate SVG">
    </form>

    <!-- Preview and Download Section -->
    <div id="previewSection">
        <h2>Preview</h2>
        <div id="svgPreview" alt="SVG Preview">
        <button id="downloadBtn" style="display:none;">Download SVG</button>
    </div>

    <script src="designs.js"></script>
    <script src="script.js"></script>
</body>
</html>
