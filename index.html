<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form id="svgForm">
        <label for="width">Width:</label>
        <input type="number" id="width" name="width" required>
        
        <label for="height">Height:</label>
        <input type="number" id="height" name="height" required>
        
        <label for="tileWidth">Tile Width:</label>
        <input type="float" id="tileWidth" name="tileWidth" required>
        <br>
        <!-- Add checkboxes here -->
        <fieldset>
            <input type="checkbox" name="options" value="wineGlasses" checked>
            <label for="wineGlasses">Wine Glasses</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="waterGlasses" checked>
            <label for="waterGlasses">Water Glasses</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="pots" checked>
            <label for="pots">Pots</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="pans" checked>
            <label for="pans">Pans</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="plates" checked>
            <label for="plates">Plates</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="bowls" checked>
            <label for="bowls">Bowls</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="coffeeCups" checked>
            <label for="coffeeCups">Coffee Cups</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="utensils" checked>
            <label for="utensils">Knives & Forks</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="corkscrew" checked>
            <label for="corkscrew">Corkscrew</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="spices" checked>
            <label for="spices">Spices</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="baking" checked>
            <label for="baking">Baking</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="trash" checked>
            <label for="trash">Trash</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="broomMop" checked>
            <label for="broomMop">Broom / Mop</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="cleaningSupplies" checked>
            <label for="cleaningSupplies">Cleaning Supplies</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="toiletPaper" checked>
            <label for="toiletPaper">Toilet Paper</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="recycling" checked>
            <label for="recycling">Recycling</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="bathroom" checked>
            <label for="bathroom">Bathroom</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="closet" checked>
            <label for="qr">Closet</label>
        </span>
        <span>
            <input type="checkbox" name="options" value="qr" checked>
            <label for="qr">QR Code</label>
        </span>
        </fieldset>
        <input type="submit" value="Generate SVG">
    </form>

    <!-- Preview and Download Section -->
    <div id="previewSection">
        <h2>Preview</h2>
        <div id="svgPreview" alt="SVG Preview">
        <button id="downloadBtn" style="display:none;">Download SVG</button>
    </span>

    <script src="designs.js"></script>
    <script src="script.js"></script>
</body>
</html>
